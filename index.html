
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Wes's Unblocked Hub</title>
<link rel="icon" href="logo.png">

<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #09090b;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    transition: opacity .25s ease;
  }

  #loader img {
    width: 260px;
    max-width: 75vw;
    pointer-events: none;
    opacity: .95;
  }

  .wordmark {
    color: #fafafa;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: .08em;
    text-align: center;
  }

  .bar {
    width: 130px;
    height: 2px;
    border-radius: 2px;
    overflow: hidden;
    background: rgba(255,255,255,.08);
  }

  .bar i {
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 2px;
    background: rgba(255,255,255,.5);
    animation: slide 1.1s ease-in-out infinite;
  }

  @keyframes slide {
    0% {
      transform: translateX(-110%);
    }

    100% {
      transform: translateX(330%);
    }
  }

  #error {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    text-align: center;
    overflow: auto;
    box-sizing: border-box;
    background: #09090b;
  }

  #error img {
    width: 220px;
    max-width: 65vw;
    opacity: .9;
    margin-bottom: 22px;
  }

  #error h1 {
    color: #fafafa;
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 8px;
  }

  #error .reason {
    color: #a1a1aa;
    font-size: 12.5px;
    line-height: 1.6;
    max-width: 460px;
    margin: 0 0 16px;
  }

  #error pre {
    color: #71717a;
    font: 11px/1.7 monospace;
    text-align: left;
    white-space: pre-wrap;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 8px;
    padding: 12px 14px;
    max-width: 540px;
    margin: 0 0 18px;
  }

  #error button {
    background: #fff;
    color: #000;
    border: 0;
    border-radius: 6px;
    padding: 9px 24px;
    font: 600 13px Arial;
    cursor: pointer;
  }

  #error button:hover {
    background: #e4e4e7;
  }

  #frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: #000;
  }
</style>
</head>

<body>

<div id="loader">

  <img
    src="logo.png"
    alt="Wes's Unblocked Hub"
    draggable="false"
  >

  <span class="wordmark">
    Wes's Unblocked Hub
  </span>

  <div class="bar">
    <i></i>
  </div>

</div>


<div id="error">

  <img
    src="logo.png"
    alt="Wes's Unblocked Hub"
    draggable="false"
    onerror="
      this.style.display='none';
      document.getElementById('errWordmark').style.display='block';
    "
  >

  <span
    class="wordmark"
    id="errWordmark"
    style="display:none;"
  >
    Wes's Unblocked Hub
  </span>

  <h1>Couldn't load Wes's Unblocked Hub</h1>

  <p class="reason" id="reason"></p>

  <pre id="detail"></pre>

  <button id="retry">
    Retry now
  </button>

</div>


<iframe
  id="frame"
  referrerpolicy="no-referrer"
  allow="fullscreen; pointer-lock; gamepad; autoplay; clipboard-read; clipboard-write; camera; microphone">
</iframe>


<script>

/* =======================================================================
   WES'S UNBLOCKED HUB
   ======================================================================= */

const CONFIG = {

  SOURCES: [
    "https://raw.githubusercontent.com/dobberr/mantle-menu/main/index.html",
    "https://cdn.jsdelivr.net/gh/dobberr/mantle-menu@main/index.html",
    "https://raw.githack.com/dobberr/mantle-menu/main/index.html",
    "https://cdn.statically.io/gh/dobberr/mantle-menu/main/index.html"
  ],

  BASE_HREF:
    "https://cdn.jsdelivr.net/gh/dobberr/mantle-menu@main/",

  CACHE_KEY:
    "wes-unblocked-hub.cache.v1"
};


/* -----------------------------------------------------------------------
   Load the hub
   ----------------------------------------------------------------------- */

let hubPromise = null;

function getHub() {

  if (!hubPromise) {

    hubPromise = (async () => {

      let lastErr;

      for (const url of CONFIG.SOURCES) {

        try {

          const res = await fetch(url, {
            cache: "no-cache"
          });

          if (!res.ok) {
            throw new Error(
              "HTTP " +
              res.status +
              " from " +
              new URL(url).host
            );
          }

          const html = await res.text();

          /*
           * Make sure we received an actual HTML page.
           */
          if (
            html.length < 200 ||
            !/<html/i.test(html)
          ) {
            throw new Error(
              "Response from " +
              new URL(url).host +
              " wasn't a valid hub page"
            );
          }

          try {
            localStorage.setItem(
              CONFIG.CACHE_KEY,
              html
            );
          } catch (_) {}

          return html;

        } catch (e) {

          lastErr = e;

        }
      }


      /*
       * Use the last cached copy if available.
       */
      const cached = (() => {

        try {
          return localStorage.getItem(
            CONFIG.CACHE_KEY
          );
        } catch (_) {
          return null;
        }

      })();


      if (cached) {
        return cached;
      }


      throw lastErr ||
        new Error("All hub sources failed");

    })().catch(e => {

      hubPromise = null;
      throw e;

    });

  }

  return hubPromise;
}


/* -----------------------------------------------------------------------
   Put the hub into the iframe
   ----------------------------------------------------------------------- */

function install(html, doc) {

  if (
    CONFIG.BASE_HREF &&
    !/<base\s/i.test(html)
  ) {

    html = /<head[^>]*>/i.test(html)

      ? html.replace(
          /<head[^>]*>/i,
          m =>
            m +
            '<base href="' +
            CONFIG.BASE_HREF +
            '">'
        )

      : '<base href="' +
        CONFIG.BASE_HREF +
        '">' +
        html;
  }


  doc.open();
  doc.write(html);
  doc.close();
}


/* -----------------------------------------------------------------------
   Start launcher
   ----------------------------------------------------------------------- */

const frame =
  document.getElementById("frame");

const loader =
  document.getElementById("loader");

const errBox =
  document.getElementById("error");

let busy = false;


async function boot() {

  if (
    busy ||
    frame.style.display === "block"
  ) {
    return;
  }

  busy = true;

  errBox.style.display = "none";
  loader.style.display = "flex";
  loader.style.opacity = "1";


  try {

    const html = await getHub();

    install(
      html,
      frame.contentDocument
    );

    frame.style.display = "block";

    loader.style.opacity = "0";

    setTimeout(() => {
      loader.remove();
    }, 300);

  } catch (e) {

    loader.style.display = "none";

    showError(e);

    setTimeout(
      boot,
      12000
    );

  } finally {

    busy = false;

  }
}


/* -----------------------------------------------------------------------
   Error screen
   ----------------------------------------------------------------------- */

function showError(e) {

  document.getElementById(
    "reason"
  ).textContent =
    "Wes's Unblocked Hub couldn't be loaded. " +
    "It will automatically retry.";

  document.getElementById(
    "detail"
  ).textContent =
    (e && e.message
      ? e.message
      : String(e)
    ) +

    "\n\nTried:\n" +

    CONFIG.SOURCES
      .map(u => "  " + u)
      .join("\n");


  errBox.style.display = "flex";
}


/* -----------------------------------------------------------------------
   Retry button
   ----------------------------------------------------------------------- */

document
  .getElementById("retry")
  .addEventListener(
    "click",
    boot
  );


/* Start */
boot();

</script>

</body>
</html>
